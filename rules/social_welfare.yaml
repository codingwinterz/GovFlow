scheme: social_welfare
version: "2002.10-published"
source: "Dayanand Social Security Scheme (DSSS), notification No. 50/354/02-03/HC/part-I/4247 dated 02/10/2002, as published by the Directorate of Social Welfare, Goa"
confidence_threshold: 0.85
sla_days: 30                       # VERIFY: 30-day SLA (not stated in the notification)
labels:
  title: "Social welfare: pension"
  amounts: "Annual pension"
  total: "Total annual pension"

# Monthly financial assistance under the Goa Dayanand Social Security Scheme, shown as an annual amount (monthly x 12).
# Added purely via YAML with zero scheme-specific Python code. The system recommends; only an officer decides.
#
# SOURCE for every value marked "Source: notification": Directorate of Social Welfare, Goa, DSSS page
# (https://socialwelfare.goa.gov.in/?p=2518), notification No. 50/354/02-03/HC/part-I/4247 dated 02/10/2002.
# NOTE: 2002 notification as published on the department site; later amendments not confirmed. A state commission
# has recommended raising the income limit, which is a recommendation, not law.
# Earlier drafts of this file used Rs 1.5 lakh and Rs 3 lakh income limits and 80+ / minor-child supplements from
# other public sources; they are not in the published notification and were removed on 2026-11-19.
required_documents:
  - id: application
    fields: {name: text}
  - id: identity_proof
    fields: {name: text, id_number: text, expiry_date: date}
    validity:
      expiry_field: expiry_date
  - id: residence_proof            # residence certificate: born in Goa, or years of domicile
    fields:
      name: text
      village: text
      born_in_goa: {one_of: ["yes", "no"]}   # Source: notification (bona fide resident by birth)
      years_in_goa: number                   # Source: notification (or by 15 years of domicile)
      issue_date: date
    plausible:
      years_in_goa: [0, 120]
    validity:
      date_field: issue_date
      max_age_days: 365            # VERIFY: how recent the residence proof must be (not stated in the notification)
  - id: income_certificate         # issued by the Mamlatdar / competent authority
    fields: {name: text, annual_income: number, issue_date: date}
    plausible:
      annual_income: [0, 100000000]
    validity:
      date_field: issue_date
      max_age_days: 365            # VERIFY: income certificate validity period (not stated in the notification)
  - id: category_proof             # age proof, widowhood / single-status record, or disability certificate
    fields:
      name: text
      applicant_category: {one_of: [senior_citizen, person_with_disability, widow, single_woman]}   # Source: notification
      age_years: number
      disability_type: {one_of: [none, blindness, hearing_or_speech_impairment, locomotor_disability, intellectual_disability, mental_illness]}   # Source: notification (disabilities listed)
      disability_percent: percent
      remarks: text
    may_be_blank: [remarks]
    plausible:
      age_years: [0, 120]
      disability_percent: [0, 100]

verification_checks:
  - id: name_match
    fields: [name]
    across: [application, identity_proof, residence_proof, income_certificate, category_proof]
    tolerance: fuzzy_0.9
    severity: high
    citizen_remedy: name_mismatch
  - id: duplicate_claim
    builtin: duplicate_claim
    key: identity_proof.id_number
    ignore_statuses: [withdrawn]
    severity: high
    messages:
      key_unavailable: "Cannot check for duplicate pension claim: {key_expr} unavailable."
      no_competitor: "No other pension claim for ID {key}."
      competing: "Claims {ids} share ID {key}; verify no duplicate pension is active."

eligibility_rules:
  - id: documents_complete
    clause: "<DSSS clause: required documents>"   # VERIFY: clause number in notification 4247
    when: "all_documents_present"
    fail_reason: "One or more required documents are missing."
  - id: identity_verified
    clause: "<DSSS clause: identity verification>"   # VERIFY: clause number in notification 4247
    depends_on: [name_match]
    when: "identity_proof.present"
    fail_reason: "Identity proof is missing or the name does not match the application."
  - id: goa_residency_eligible
    clause: "<DSSS clause: bona fide resident by birth or 15 years of domicile>"   # Source: notification; VERIFY: clause number
    # Born in Goa first: a resident by birth qualifies whatever the years of domicile.
    when: "residence_proof.born_in_goa == 'yes' or residence_proof.years_in_goa >= params.min_residency_years"
    fail_reason: "Applicant is not a resident of Goa by birth and has fewer than 15 years of domicile."
  - id: income_within_limit
    clause: "<DSSS clause: income limit>"   # Source: notification (Rs 24,000 per year); VERIFY: clause number
    when: "income_certificate.annual_income <= params.max_annual_income"
    fail_reason: "Annual income exceeds the scheme's income limit."
  - id: category_threshold_met
    clause: "<DSSS clause: categories of beneficiaries>"   # Source: notification; VERIFY: clause number
    # Senior citizen: 60 at the time of application. Disability: an adult with one of the listed disabilities.
    # Widows and single women: below 60 (the stated amount is for women below 60; at 60 or over the senior-citizen
    # category applies: VERIFY), from the minimum age below.
    when: "(category_proof.applicant_category == 'senior_citizen' and category_proof.age_years >= params.senior_min_age) or (category_proof.applicant_category == 'person_with_disability' and category_proof.age_years >= params.adult_min_age and category_proof.disability_type != 'none' and category_proof.disability_percent >= params.min_disability_percent) or ((category_proof.applicant_category == 'widow' or category_proof.applicant_category == 'single_woman') and category_proof.age_years >= params.single_woman_min_age and category_proof.age_years < params.single_woman_max_age)"
    fail_reason: "Applicant does not meet the age or disability condition for the selected category."
  - id: documents_not_expired
    clause: "<DSSS clause: document validity>"   # VERIFY: clause number in notification 4247
    when: "all_documents_valid"
    fail_reason: "One or more documents are expired or too old."
  - id: no_competing_claim
    clause: "<DSSS clause: single active pension>"   # VERIFY: clause number in notification 4247
    depends_on: [duplicate_claim]
    fail_reason: "Another active or decided pension claim shares the same identity number."

# Self-check before applying: dry run of the residence and income rules (nothing is stored).
self_check:
  questions:
    - field: residence_proof.born_in_goa
      prompt: "Were you born in Goa?"
      choices: ["yes", "no"]
    - field: residence_proof.years_in_goa
      prompt: "How many years have you lived in Goa?"
    - field: income_certificate.annual_income
      prompt: "What is your annual income (in rupees)?"
    - field: category_proof.applicant_category
      prompt: "Which category applies to you?"
      choices: ["senior_citizen", "person_with_disability", "widow", "single_woman"]
  rules: [goa_residency_eligible, income_within_limit]

# The annual pension: the published monthly amount for the category x 12.
compensation:
  inputs:
    applicant_category:
      from: category_proof.applicant_category
    age_years:
      from: category_proof.age_years
    disability_percent:
      from: category_proof.disability_percent
  parameters:
    min_residency_years: 15             # Source: notification (15 years of domicile)
    max_annual_income: 24000            # Source: notification (Rs 24,000 per year)
    senior_min_age: 60                  # Source: notification (age 60 at the time of application)
    senior_monthly: 2000                # Source: notification (Rs 2,000 a month)
    adult_min_age: 18                   # VERIFY: "adult" read as 18 or over (age not stated for this category)
    min_disability_percent: 40          # VERIFY: minimum disability not stated on the page; 40% is the benchmark disability under the RPwD Act, 2016
    disability_monthly: 2000            # Source: notification (Rs 2,000 a month)
    severe_disability_min_percent: 90   # Source: notification (90 to 100% disability)
    severe_disability_monthly: 3500     # Source: notification (Rs 3,500 a month for 90 to 100%)
    single_woman_monthly: 2500          # Source: notification (Rs 2,500 a month for widows and single women below 60)
    single_woman_max_age: 60            # Source: notification ("below 60")
    # VERIFY CONFLICT: the page's category list says single women are 18 and above, but its objectives text says
    # unmarried women above 50. 18 is used here for every single woman until the Directorate confirms.
    single_woman_min_age: 18            # Source: notification (category list); VERIFY CONFLICT above
    months_per_year: 12                 # monthly amount shown per year
  components:
    - id: base_pension
      formula: "months_per_year * (senior_monthly * (applicant_category == 'senior_citizen') + disability_monthly * (applicant_category == 'person_with_disability') * (disability_percent < severe_disability_min_percent) + severe_disability_monthly * (applicant_category == 'person_with_disability') * (disability_percent >= severe_disability_min_percent) + single_woman_monthly * ((applicant_category == 'widow') + (applicant_category == 'single_woman')) * (age_years < single_woman_max_age))"

terms:
  application: Application form
  identity_proof: Identity proof
  residence_proof: Residence proof
  income_certificate: Income certificate
  category_proof: Category proof
  name: Name
  id_number: ID number
  expiry_date: Expiry date
  village: Village
  born_in_goa: Born in Goa
  years_in_goa: Years in Goa
  issue_date: Issue date
  annual_income: Annual income
  applicant_category: Applicant category
  age_years: Age (years)
  disability_type: Type of disability
  disability_percent: Disability (%)
  remarks: Remarks
  documents_complete: All required documents submitted
  identity_verified: Identity verified and name matches
  goa_residency_eligible: Resident of Goa by birth or 15 years of domicile
  income_within_limit: Annual income within the limit
  category_threshold_met: Age or disability condition for the category met
  documents_not_expired: Documents within validity period
  no_competing_claim: No competing pension claim on this ID
  name_match: Name across documents
  duplicate_claim: Duplicate ID number check
  base_pension: Annual pension (monthly amount x 12)
  min_residency_years: Minimum years of Goa domicile
  max_annual_income: Annual income limit
  senior_min_age: Minimum age for senior citizen
  senior_monthly: Senior citizen monthly amount
  adult_min_age: Minimum age for an adult with a disability
  min_disability_percent: Minimum disability (%)
  disability_monthly: Disability monthly amount
  severe_disability_min_percent: Disability (%) for the higher rate
  severe_disability_monthly: Monthly amount at 90 to 100% disability
  single_woman_monthly: Widow or single woman monthly amount
  single_woman_max_age: Age below which the widow or single woman amount applies
  single_woman_min_age: Minimum age for widows and single women
  months_per_year: Months in a year
