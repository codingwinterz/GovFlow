scheme: social_welfare
version: "2026.1-draft"
source: "Goa Dayanand Social Security Scheme (DSSS); rates and clauses to be confirmed"   # VERIFY: confirm current DSSS Goa government notification, slab rates, and clause numbers
confidence_threshold: 0.85
sla_days: 30                       # VERIFY: target days from intake to decision for DSSS pension
labels:
  title: "Social welfare: pension"
  amounts: "Annual pension"
  total: "Total annual pension"

# Monthly financial assistance (annualized here) under the Goa Dayanand Social Security Scheme.
# Added purely via YAML with zero scheme-specific Python code. Items marked VERIFY need official confirmation.
required_documents:
  - id: application
    fields: {name: text}
  - id: identity_proof
    fields: {name: text, id_number: text, expiry_date: date}
    validity:
      expiry_field: expiry_date
  - id: residence_proof            # e.g. 15-year Goa residence certificate or voter/ration record
    fields: {name: text, village: text, years_in_goa: number, issue_date: date}
    plausible:
      years_in_goa: [0, 120]
    validity:
      date_field: issue_date
      max_age_days: 365            # VERIFY: how recent the residence proof must be
  - id: income_certificate         # issued by Mamlatdar / competent authority
    fields: {name: text, annual_income: number, issue_date: date}
    plausible:
      annual_income: [0, 100000000]
    validity:
      date_field: issue_date
      max_age_days: 365            # VERIFY: income certificate validity period in days
  - id: category_proof             # age proof, widowhood certificate, or UDID / disability certificate
    fields:
      name: text
      applicant_category: {one_of: [senior_citizen, widow, person_with_disability, single_woman]}   # VERIFY: confirm eligible DSSS categories
      age_years: number
      disability_percent: percent
      minor_child_count: number    # VERIFY: whether minor-child supplement applies
      remarks: text
    may_be_blank: [remarks]
    plausible:
      age_years: [0, 120]
      disability_percent: [0, 100]
      minor_child_count: [0, 20]

verification_checks:
  - id: name_match
    fields: [name]
    across: [application, identity_proof, residence_proof, income_certificate, category_proof]
    tolerance: fuzzy_0.9
    severity: high
    citizen_remedy: name_mismatch
  - id: duplicate_claim
    builtin: duplicate_claim
    key: identity_proof.id_number
    ignore_statuses: [withdrawn]
    severity: high
    messages:
      key_unavailable: "Cannot check for duplicate pension claim: {key_expr} unavailable."
      no_competitor: "No other pension claim for ID {key}."
      competing: "Claims {ids} share ID {key}; verify no duplicate pension is active."

eligibility_rules:
  - id: documents_complete
    clause: "<DSSS clause: required documents>"   # VERIFY: cite DSSS notification clause
    when: "all_documents_present"
    fail_reason: "One or more required documents are missing."
  - id: identity_verified
    clause: "<DSSS clause: identity verification>"   # VERIFY: cite DSSS notification clause
    depends_on: [name_match]
    when: "identity_proof.present"
    fail_reason: "Identity proof is missing or the name does not match the application."
  - id: goa_residency_eligible
    clause: "<DSSS clause: 15-year Goa residence>"   # VERIFY: confirm 15-year continuous Goa residence clause
    when: "residence_proof.years_in_goa >= params.min_residency_years"
    fail_reason: "Applicant has lived in Goa for fewer than the required years."
  - id: income_within_limit
    clause: "<DSSS clause: annual family income ceiling>"   # VERIFY: confirm annual family income limit
    when: "income_certificate.annual_income <= params.max_annual_income"
    fail_reason: "Annual family income exceeds the scheme ceiling."
  - id: category_threshold_met
    clause: "<DSSS clause: category age or disability threshold>"   # VERIFY: confirm age and disability thresholds per category
    when: "(category_proof.applicant_category == 'senior_citizen' and category_proof.age_years >= params.senior_min_age) or (category_proof.applicant_category == 'person_with_disability' and category_proof.disability_percent >= params.min_disability_percent) or (category_proof.applicant_category == 'widow') or (category_proof.applicant_category == 'single_woman' and category_proof.age_years >= params.single_woman_min_age)"
    fail_reason: "Applicant does not meet the age or disability threshold for the selected category."
  - id: documents_not_expired
    clause: "<DSSS clause: document validity>"   # VERIFY: cite DSSS document validity clause
    when: "all_documents_valid"
    fail_reason: "One or more documents are expired or too old."
  - id: no_competing_claim
    clause: "<DSSS clause: single active pension>"   # VERIFY: cite DSSS single-benefit clause
    depends_on: [duplicate_claim]
    fail_reason: "Another active or decided pension claim shares the same identity number."

# Self-check before applying: dry run of residency and income rules (nothing is stored).
self_check:
  questions:
    - field: residence_proof.years_in_goa
      prompt: "How many years have you lived in Goa?"
    - field: income_certificate.annual_income
      prompt: "What is your family's total annual income (in rupees)?"
    - field: category_proof.applicant_category
      prompt: "Which category applies to you?"
      choices: ["senior_citizen", "widow", "person_with_disability", "single_woman"]
  rules: [goa_residency_eligible, income_within_limit]

# Annualized pension components computed by the shared formula engine.
compensation:
  inputs:
    applicant_category:
      from: category_proof.applicant_category
    age_years:
      from: category_proof.age_years
    minor_child_count:
      from: category_proof.minor_child_count
  parameters:
    min_residency_years: 15             # VERIFY: minimum years of Goa residence
    max_annual_income: 150000           # VERIFY: annual family income ceiling (INR)
    senior_min_age: 60                  # VERIFY: minimum age for senior citizen category
    single_woman_min_age: 40            # VERIFY: minimum age for single woman category
    min_disability_percent: 40          # VERIFY: minimum disability percentage
    senior_base_annual: 24000           # VERIFY: annual base pension for senior citizen (Rs 2,000/month x 12)
    widow_base_annual: 24000            # VERIFY: annual base pension for widow (Rs 2,000/month x 12)
    disability_base_annual: 24000       # VERIFY: annual base pension for person with disability (Rs 2,000/month x 12)
    single_woman_base_annual: 24000     # VERIFY: annual base pension for single woman (Rs 2,000/month x 12)
    high_age_bonus_annual: 6000         # VERIFY: additional annual support for senior citizens aged 80+
    minor_child_supplement_annual: 6000 # VERIFY: annual supplement for widow supporting minor children
  components:
    - id: base_pension
      formula: "(senior_base_annual * (applicant_category == 'senior_citizen')) + (widow_base_annual * (applicant_category == 'widow')) + (disability_base_annual * (applicant_category == 'person_with_disability')) + (single_woman_base_annual * (applicant_category == 'single_woman'))"
    - id: senior_age_supplement
      formula: "high_age_bonus_annual * (applicant_category == 'senior_citizen') * (age_years >= 80)"
    - id: widow_child_supplement
      formula: "minor_child_supplement_annual * (applicant_category == 'widow') * (minor_child_count >= 1)"

terms:
  application: Application form
  identity_proof: Identity proof
  residence_proof: Residence proof
  income_certificate: Income certificate
  category_proof: Category proof
  name: Name
  id_number: ID number
  expiry_date: Expiry date
  village: Village
  years_in_goa: Years in Goa
  issue_date: Issue date
  annual_income: Annual family income
  applicant_category: Applicant category
  age_years: Age (years)
  disability_percent: Disability (%)
  minor_child_count: Minor children count
  remarks: Remarks
  documents_complete: All required documents submitted
  identity_verified: Identity verified and name matches
  goa_residency_eligible: Minimum Goa residence met
  income_within_limit: Annual family income within limit
  category_threshold_met: Category age or disability threshold met
  documents_not_expired: Documents within validity period
  no_competing_claim: No competing pension claim on this ID
  name_match: Name across documents
  duplicate_claim: Duplicate ID number check
  base_pension: Base annual pension
  senior_age_supplement: Senior age supplement
  widow_child_supplement: Widow minor-child supplement
  senior_base_annual: Senior citizen base annual pension
  widow_base_annual: Widow base annual pension
  disability_base_annual: Disability base annual pension
  single_woman_base_annual: Single woman base annual pension
  high_age_bonus_annual: Additional support for age 80+
  minor_child_supplement_annual: Widow minor-child annual supplement
  min_residency_years: Minimum years of Goa residence
  max_annual_income: Annual family income ceiling
  senior_min_age: Minimum age for senior citizen
  single_woman_min_age: Minimum age for single woman
  min_disability_percent: Minimum disability (%)
