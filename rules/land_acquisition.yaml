scheme: land_acquisition
version: "0.1.0"
source: "RFCTLARR Act 2013 and Goa notifications"   # VERIFY: exact notification references
confidence_threshold: 0.85
sla_days: 60                       # VERIFY: target days from intake to officer decision (placeholder)
labels:                            # wording shown by the API and the officer dashboard
  title: "Land acquisition compensation"
  amounts: "Compensation"
  total: "Total compensation"

# Every document type the scheme needs. `validity` is optional:
#   expiry_field: field holding an ISO expiry date (invalid after that date)
#   date_field + max_age_days: issue date must be within N days of the case reference date
# The `application` document is the form typed in by the clerk (confidence 1.0).
# `fields` maps what extraction must read to its type: text | number | percent | date | unit.
# number accepts plain digits or valid Indian/Western grouping (1,00,000 or 100,000);
# percent also accepts a trailing % ("80%" -> 80) and must be within 0-100 inclusive.
# `derived` declares computed fields, e.g. area_sqm from a number and a unit field.
# Extracted strings are coerced once before any rule sees them; a value that cannot be
# coerced ("80%", "eighty", "15/11/2026", "bigha") goes to human review with its reason.
# `plausible` gives [min, max] for a number, percent or derived field. A value outside goes to human review
# whatever confidence the extraction reported (a document cannot vouch for itself).
required_documents:
  - id: application
    fields: {name: text}
  - id: ownership_record          # Form I & XIV
    fields: {name: text, survey_number: text, area: number, area_unit: unit, issue_date: date}
    derived:
      area_sqm: {convert: area, unit_field: area_unit, to: sqm}
    plausible:
      area_sqm: [10, 500000]       # VERIFY: 10 sqm to 50 hectares for one holding (placeholder sanity range)
    validity:
      date_field: issue_date
      max_age_days: 180            # VERIFY: how recent the extract must be
  - id: identity_proof
    fields: {name: text, id_number: text, expiry_date: date}
    validity:
      expiry_field: expiry_date
  - id: survey_sheet
    fields: {survey_number: text, area: number, area_unit: unit}
    derived:
      area_sqm: {convert: area, unit_field: area_unit, to: sqm}
    plausible:
      area_sqm: [10, 5000000]      # VERIFY: a whole survey number, up to 500 hectares (placeholder sanity range)
  - id: mutation_record
    fields: {name: text, issue_date: date}
    validity:
      date_field: issue_date
      max_age_days: 365            # VERIFY: how recent the mutation extract must be

# Cross-document checks. Result status is pass | fail | needs_review.
#   fuzzy_T: pass if score >= T, needs_review if score >= confidence_threshold, else fail;
#            a name differing only by a dropped middle name (or initial) is always
#            needs_review: never pass, never fail
#   exact:   pass if normalised values are equal, else fail
#   duplicate_claim (built-in): needs_review when another case claims the same key. With
#     claimed_area and total_area, co-claims that fit within the total pass. Approved cases count;
#     rejected and withdrawn cases do not. `messages` holds the officer-facing wording
#     (placeholders: key_expr; key; ids, key; ids, key, combined, total).
verification_checks:
  - id: name_match
    fields: [name]
    across: [application, ownership_record, identity_proof]
    tolerance: fuzzy_0.9
    severity: high
  - id: survey_no_match
    fields: [survey_number]
    across: [ownership_record, survey_sheet]
    tolerance: exact
    severity: high
  - id: duplicate_claim
    builtin: duplicate_claim
    key: ownership_record.survey_number
    claimed_area: ownership_record.area_sqm
    total_area: survey_sheet.area_sqm
    severity: high
    messages:
      key_unavailable: "Cannot check duplicates: {key_expr} unavailable"
      no_competitor: "No other open case claims {key}."
      competing: "Open cases {ids} also claim {key}; areas unknown, cannot rule out overlap."
      within_total: "Open cases {ids} also claim {key}, but combined area {combined} fits within survey total {total} (co-owners)."
      exceeds_total: "Open cases {ids} also claim {key}; combined area {combined} exceeds survey total {total}."

# A rule passes only if every `depends_on` check passed and `when` is true.
# Expressions can read scheme parameters as params.<name> (unknown names fail at load),
# test membership with `x in ['a', 'b']`, and compare text case-insensitively with lower(x).
# A failed dependency fails the rule; a needs_review dependency makes it needs_review.
# A field that is missing or below confidence_threshold makes the rule needs_review.
eligibility_rules:
  - id: documents_complete
    clause: "<clause ref>"
    when: "all_documents_present"
    fail_reason: "One or more required documents are missing."
  - id: valid_ownership
    clause: "<clause ref>"
    depends_on: [name_match]
    when: "ownership_record.present"
    fail_reason: "Ownership record missing or owner name does not match the applicant."
  - id: land_identified
    clause: "<clause ref>"
    depends_on: [survey_no_match]
    fail_reason: "Survey number differs between ownership record and survey sheet."
  - id: documents_not_expired
    clause: "<clause ref>"
    when: "all_documents_valid"
    fail_reason: "One or more documents are expired or too old."
  - id: no_competing_claim
    clause: "<clause ref>"
    depends_on: [duplicate_claim]
    fail_reason: "Another open case claims an overlapping area of the same survey number."

compensation:
  # Where each formula variable comes from. `from` is an expression over the case
  # (documents by id, `case` = officer-entered inputs, `reference_date`).
  inputs:
    area_sqm:
      from: ownership_record.area_sqm
    market_value_per_sqm:
      from: case.market_value_per_sqm
      range: [100, 100000]         # VERIFY: Rs per sqm sanity range for Goa (placeholder); outside -> review
    assets_total:
      from: case.assets_total
    multiplier:
      # Per-case input: urban areas 1.00; rural areas 1.00 to 2.00 as notified by the state.
      # Outside 1.00-2.00 the case goes to review (never clamped).
      from: case.multiplier
      range: [1.0, 2.0]
      default: 1.0                 # VERIFY: placeholder; Goa's notified rural factor is unconfirmed
    years_since_notification:
      # The 12% additional amount runs from the SIA notification date to the EARLIER of the
      # award and the taking of possession.
      years_between:
        start: case.sia_notification_date   # no default: never guessed
        end_earliest_of: [case.award_date, case.possession_date]
        end_default_from: reference_date    # VERIFY: a date not recorded yet is assumed not yet happened and
                                            # estimated to the reference date until the award is made
  parameters:
    solatium_rate: 1.0             # 100% of (market value x multiplier + assets). VERIFY: section number unconfirmed
    interest_rate: 0.12            # 12% per year additional amount. VERIFY: section number unconfirmed
  components:
    - id: land_value
      formula: "area_sqm * market_value_per_sqm * multiplier"
    - id: assets_value
      formula: "assets_total"
    - id: solatium
      formula: "(land_value + assets_value) * solatium_rate"
    - id: interest
      # VERIFY: whether the 12% base includes the multiplier is unsettled (one High Court held that it
      # does); this formula uses land_value, which includes it.
      formula: "land_value * interest_rate * years_since_notification"

# Human labels for every identifier that can reach a screen (officer pages, citizen page, simulator).
# Keys must be identifiers of this scheme; a document field falls back to its plain field name.
terms:
  application: Application form
  ownership_record: Ownership record (Form I & XIV)
  identity_proof: Identity proof
  survey_sheet: Survey sheet
  mutation_record: Mutation record
  name: Name
  survey_number: Survey number
  area: Area
  area_unit: Area unit
  area_sqm: Area (sq m)
  issue_date: Issue date
  id_number: ID number
  expiry_date: Expiry date
  name_match: Name check across documents
  survey_no_match: Survey number check
  duplicate_claim: Overlapping claims on this survey number
  documents_complete: All documents submitted
  valid_ownership: Valid ownership
  land_identified: Land identified
  documents_not_expired: Documents current
  no_competing_claim: No competing claim
  land_value: Land value
  assets_value: Assets on the land
  solatium: Solatium
  interest: Additional amount at 12% a year
  market_value_per_sqm: Market value per sq m
  assets_total: Value of assets
  multiplier: Rural multiplier
  years_since_notification: Years from notification
  sia_notification_date: SIA notification date
  award_date: Award date
  possession_date: Possession date
  solatium_rate: Solatium rate
  interest_rate: Additional amount rate
