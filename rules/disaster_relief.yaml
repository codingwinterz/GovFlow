scheme: disaster_relief
version: "0.1.0"
source: "MHA norms 2022-26; current schedule to be confirmed"   # VERIFY: SDRF/NDRF norms 2022-26; confirm the schedule in force in Goa
confidence_threshold: 0.85
sla_days: 15                       # VERIFY: target days from intake to decision for relief (placeholder)
labels:
  title: "Disaster relief: housing damage"
  amounts: "Relief"
  total: "Total relief"

# Housing damage relief for one household after a notified disaster.
# Same format as land_acquisition.yaml; no scheme-specific Python.
# Amounts follow the MHA SDRF/NDRF norms 2022-26. Items marked VERIFY are not yet confirmed.
required_documents:
  - id: application
    fields: {name: text}
  - id: identity_proof
    fields: {name: text, id_number: text, expiry_date: date}
    validity:
      expiry_field: expiry_date
  - id: residence_proof            # e.g. house tax receipt or ration card
    fields: {name: text, house_number: text, village: text, issue_date: date}
    validity:
      date_field: issue_date
      max_age_days: 365            # VERIFY: how recent the residence proof must be
  - id: damage_assessment          # issued by the revenue / panchayat officer after the event
    fields:
      house_number: text
      village: text
      damage_percent: percent
      house_type: {one_of: [pucca, kutcha, hut]}
      area_type: {one_of: [plain, hilly]}    # VERIFY: which Goa areas count as hilly under the norms
      notified_area: text
      assessment_date: date
    validity:
      date_field: assessment_date
      max_age_days: 90             # VERIFY: how long after assessment a claim may be filed

verification_checks:
  - id: name_match
    fields: [name]
    across: [application, identity_proof, residence_proof]
    tolerance: fuzzy_0.9
    severity: high
  - id: house_match                # the assessed house is the applicant's residence
    fields: [house_number, village]
    across: [residence_proof, damage_assessment]
    tolerance: exact
    severity: high
  - id: duplicate_claim
    builtin: duplicate_claim
    key: damage_assessment.village + "/" + damage_assessment.house_number
    # No claimed_area / total_area: ANY other open claim on the same house is needs_review.
    severity: high
    messages:
      key_unavailable: "Cannot check for duplicate relief: {key_expr} unavailable."
      no_competitor: "No other open relief claim for house {key}."
      competing: "Open claims {ids} are for the same house {key}; check whether relief was already given."

eligibility_rules:
  - id: documents_complete
    clause: "<clause ref>"
    when: "all_documents_present"
    fail_reason: "One or more required documents are missing."
  - id: identity_verified
    clause: "<clause ref>"
    depends_on: [name_match]
    when: "identity_proof.present"
    fail_reason: "Identity proof missing or the name does not match the applicant."
  - id: residence_in_affected_area
    clause: "<clause ref>"
    depends_on: [house_match]
    # VERIFY: uses the damage assessment's own "notified area" certification. A notified-village
    # list could now be written with `in`, but it changes per disaster event, so it is not a scheme rule.
    when: "lower(damage_assessment.notified_area) == 'yes'"
    fail_reason: "The damaged house is not the applicant's residence or is outside the notified area."
  - id: damage_category_eligible
    clause: "<clause ref>"
    # Minimum damage comes from the parameters below (one source of truth for rule and relief).
    when: "damage_assessment.damage_percent >= params.partial_damage_threshold"
    fail_reason: "Assessed damage is below the minimum for housing relief."
  - id: documents_not_expired
    clause: "<clause ref>"
    when: "all_documents_valid"
    fail_reason: "One or more documents are expired or too old."
  - id: no_duplicate_relief
    clause: "<clause ref>"
    depends_on: [duplicate_claim]
    fail_reason: "Another open claim exists for the same house."

# Self-check before applying: questions for a dry run of the listed rules (nothing is stored).
# Cross-document checks (name, house, duplicate) can only run once documents are submitted.
self_check:
  questions:
    - field: damage_assessment.damage_percent
      prompt: "About what percentage of your house was damaged? (as on the damage assessment, if you have it)"
    - field: damage_assessment.notified_area
      prompt: "Is your house in the area notified as disaster-affected?"
      choices: ["yes", "no"]
  rules: [damage_category_eligible, residence_in_affected_area]

# Relief amounts, computed by the same formula mechanism as land compensation.
# A comparison is 1 when true and 0 when false, so each line is the amount for one damage category.
compensation:
  inputs:
    damage_percent:
      from: damage_assessment.damage_percent
    house_type:
      from: damage_assessment.house_type
    area_type:
      from: damage_assessment.area_type
  parameters:
    full_damage_threshold: 75      # VERIFY: % damage counted as fully / severely damaged (not given in the norms as a %)
    partial_damage_threshold: 15   # partially damaged pucca house: damage at least 15%.
                                   # VERIFY: the same minimum is also applied to kutcha houses, huts and the items below
    full_house_plain: 120000       # fully / severely damaged house (pucca or kutcha), plain area
    full_house_hilly: 130000       # fully / severely damaged house (pucca or kutcha), hilly area
    partial_pucca: 6500            # partially damaged pucca house (other than huts)
    partial_kutcha: 4000           # partially damaged kutcha house (other than huts)
    hut: 8000                      # damaged or destroyed hut
    clothing: 2500                 # gratuitous relief per family, loss of clothing
    utensils: 2500                 # gratuitous relief per family, loss of utensils / household goods
                                   # VERIFY: the norms tie clothing and utensils relief to houses washed away, fully
                                   # damaged or severely inundated; here it is given at the minimum damage
  # A comparison is 1 when true and 0 when false, so each line is the amount for one category.
  components:
    - id: house_full_plain
      formula: "full_house_plain * (damage_percent >= full_damage_threshold) * (house_type != 'hut') * (area_type == 'plain')"
    - id: house_full_hilly
      formula: "full_house_hilly * (damage_percent >= full_damage_threshold) * (house_type != 'hut') * (area_type == 'hilly')"
    - id: house_partial_pucca
      formula: "partial_pucca * (damage_percent >= partial_damage_threshold) * (damage_percent < full_damage_threshold) * (house_type == 'pucca')"
    - id: house_partial_kutcha
      formula: "partial_kutcha * (damage_percent >= partial_damage_threshold) * (damage_percent < full_damage_threshold) * (house_type == 'kutcha')"
    - id: hut
      formula: "hut * (damage_percent >= partial_damage_threshold) * (house_type == 'hut')"
    - id: clothing
      formula: "clothing * (damage_percent >= partial_damage_threshold)"
    - id: utensils
      formula: "utensils * (damage_percent >= partial_damage_threshold)"

# Human labels for every identifier that can reach a screen (officer pages, citizen page, simulator).
# Keys must be identifiers of this scheme; a document field falls back to its plain field name.
# hut, clothing and utensils are both a component and its amount parameter: one label serves both.
terms:
  application: Application form
  identity_proof: Identity proof
  residence_proof: Residence proof
  damage_assessment: Damage assessment report
  name: Name
  id_number: ID number
  expiry_date: Expiry date
  house_number: House number
  village: Village
  issue_date: Issue date
  damage_percent: Damage (%)
  house_type: House type
  area_type: Area type
  notified_area: In the notified area
  assessment_date: Assessment date
  name_match: Name matches across documents
  house_match: Assessed house is the residence
  duplicate_claim: No other claim on the house
  documents_complete: All documents submitted
  identity_verified: Identity verified
  residence_in_affected_area: Residence in the affected area
  damage_category_eligible: Damage meets the minimum
  documents_not_expired: Documents current
  no_duplicate_relief: No duplicate relief
  house_full_plain: Fully damaged house, plain area
  house_full_hilly: Fully damaged house, hilly area
  house_partial_pucca: Partly damaged pucca house
  house_partial_kutcha: Partly damaged kutcha house
  hut: Damaged hut
  clothing: Loss of clothing
  utensils: Loss of utensils and household goods
  full_damage_threshold: Full damage threshold (%)
  partial_damage_threshold: Minimum damage (%)
  full_house_plain: Full damage amount, plain area
  full_house_hilly: Full damage amount, hilly area
  partial_pucca: Partial damage amount, pucca house
  partial_kutcha: Partial damage amount, kutcha house
